,desc:'Keep the online business profile useful even when details evolve.'},{id:'brand',title:'CUSTOM BUSINESS BRANDING',desc:'Prepare the physical product and destination around the customer business.'},{id:'all',title:'NFC + QR + DIGITAL PROFILE',desc:'Combine tap, scan and mobile profile access in one smart identity system.'}];const featurePool=[{id:'contact',name:'CONTACT DETAILS',desc:'Phone and business identity'},{id:'whatsapp',name:'WHATSAPP',desc:'Direct chat access'},{id:'website',name:'WEBSITE',desc:'Official web destination'},{id:'instagram',name:'INSTAGRAM',desc:'Social profile access'},{id:'location',name:'LOCATION',desc:'Business location'},{id:'qr',name:'QR BACKUP',desc:'Fallback scan access'}];const products=[{id:'business',title:'NFC BUSINESS CARDS',desc:'Smart tap-to-share business identity.'},{id:'review',title:'GOOGLE REVIEW PRODUCTS',desc:'NFC + QR review cards and counter stands.'},{id:'menu',title:'RESTAURANT SMART MENU',desc:'QR/NFC digital menu solution.'},{id:'wearable',title:'NFC SMART RING',desc:'Wearable tap-based profile sharing.'}];const judges=['LOCAL BUSINESS OWNER','STARTUP FOUNDER','HOTEL / CAFE MANAGER','WORKING PROFESSIONAL'];const state={screen:'landing',stage:0,difficulty:null,visitor:null,challenge:0,solution:null,tech:[],usp:null,features:[],story:['Problem','Smart Identity','Vasuki NFC Solution','Connect'],product:null,intent:null,judge:null,score:0,time:0,total:0,sound:true,timerId:null,judging:false,evaluated:false,mentorUsed:false};function beep(freq=300,dur=.04){if(!state.sound)return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=.025;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.stop(c.currentTime+dur)}catch(e){}}function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1800)}function formatTime(s){s=Math.max(0,s|0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function startTimer(seconds){clearInterval(state.timerId);state.total=seconds;state.time=seconds;state.timerId=setInterval(()=>{if(state.screen!=='game'||['judging','results'].includes(STAGES[state.stage].key))return;if(state.time>0)state.time--;const el=document.getElementById('timer');if(el)el.textContent=formatTime(state.time);if(state.time<=10&&state.time>0)beep(180,.025);if(state.time<=0){clearInterval(state.timerId);showToast('TIME EXPIRED — PROFILE RUN CONTINUES')}},1000)}function phaseIndex(){return PHASES.indexOf(STAGES[state.stage].phase)}function renderLanding(){state.screen='landing';clearInterval(state.timerId);app.innerHTML=`<nav class="landing-nav"><a class="brand" href="https://vasukinfc.in/" target="_blank" rel="noopener"><div class="brand-icon">&gt;_</div><div class="brand-title">THE FOUNDER <span>SIMULATOR</span></div></a><div class="build">HEMSHANKAR//VASUKI_NFC</div></nav><main class="landing-main"><section class="hero"><div class="badge fade d1">🏆 A DECISION-DRIVEN FOUNDER PROFILE</div><h1 class="fade d2">TAP. BUILD. <span>CONNECT.</span></h1><p class="fade d3">Play through the founder profile of Hemshankar Agarwal and discover how Vasuki NFC approaches smart business identity, NFC cards, QR profiles and customer touchpoints.</p></section><section class="runner fade d3"><div class="runner-version">PROFILE RUNNER V2.4</div><div><div class="runner-head"><span class="pulse"></span><span>THE REAL PROFILE SEQUENCE</span></div><div class="sequence" style="margin-top:16px"><div class="step"><b>01/</b><span>Choose your pace and visitor profile.</span></div><div class="step"><b>02/</b><span>Draw a real business identity challenge.</span></div><div class="step"><b>03/</b><span>Build the NFC + QR + digital profile solution.</span></div><div class="step"><b>04/</b><span>Face the final reviewer and unlock the founder profile.</span></div></div></div><button class="primary" data-action="launch">START PROFILE RUN →</button></section><section class="metrics fade d4"><span>⏱ 10 MINUTE RUN</span><span>•</span><span>⚡ NFC + QR</span><span>•</span><span>👤 FOUNDER PROFILE</span><span>•</span><span>⚖ DYNAMIC REVIEW</span></section><section class="features fade d5"><article class="feature"><h3>👥 VISITOR ROLE</h3><p>Choose who you are before entering the profile simulation.</p></article><article class="feature"><h3>✨ SMART IDENTITY BUILDER</h3><p>Make product, technology and feature decisions using Vasuki NFC information.</p></article><article class="feature"><h3>⏱ REAL GAME FLOW</h3><p>Move through rounds, a live timer, progress states, review and results.</p></article><article class="feature"><h3>▦ PROFILE STORYBOARD</h3><p>Arrange the story from business problem to smart identity solution.</p></article><article class="feature"><h3>&gt;_ FOUNDER CHECKPOINT</h3><p>Unlock verified public information about Hemshankar Agarwal and Vasuki NFC.</p></article><article class="feature"><h3>🛡 FINAL REVIEW</h3><p>Get a score based on your choices, then unlock direct contact options.</p></article></section></main><footer class="landing-footer">THE FOUNDER SIMULATOR v2.4 — HEMSHANKAR AGARWAL · VASUKI NFC · JAIPUR</footer>`}function renderHeader(){const pi=phaseIndex();return `<header class="game-header"><div class="game-logo"><div class="square">&gt;_</div><b>FOUNDER SIM</b></div><nav class="phase-stepper">${PHASES.map((p,i)=>`<div class="phase-node ${i<pi?'done':''} ${i===pi?'active':''}">${i?'<span class="phase-line"></span>':''}<span class="phase-chip">${p}</span></div>`).join('')}</nav><div class="game-tools"><button class="icon-btn" data-action="sound" title="Toggle sound">${state.sound?'🔊':'🔇'}</button>${state.difficulty?`<span class="timer" id="timer">${formatTime(state.time)}</span>`:''}</div></header>`}function selectedClass(v,current){return v===current?' selected':''}function optionsHtml(items,current,action){return `<div class="options">${items.map(x=>`<button class="option${selectedClass(x.id||x.key,current)}" data-action="${action}" data-value="${x.id||x.key}"><span class="option-title">${x.title||x.name}</span><span class="option-desc">${x.desc}</span></button>`).join('')}</div>`}function stageContent(){const key=STAGES[state.stage].key;if(key==='difficulty'){const opts=[{key:'easy',name:'RELAXED PROFILE (EASY)',desc:'10-minute countdown // explore every round at a comfortable pace.'},{key:'medium',name:'STANDARD RUN (MEDIUM)',desc:'7-minute countdown // classic fast decision pace.'},{key:'hard',name:'CRUNCH PROFILE (HARD)',desc:'5-minute countdown // quicker choices and higher final multiplier.'},{key:'dev',name:'SPEED TAP (DEV)',desc:'60-second countdown // fast test run.'}];return optionsHtml(opts,state.difficulty,'difficulty')}if(key==='teamFormation'){return optionsHtml([{id:'owner',title:'BUSINESS OWNER',desc:'Explore smart identity for a shop, company or local business.'},{id:'professional',title:'WORKING PROFESSIONAL',desc:'Explore a personal business card and digital profile.'},{id:'hospitality',title:'HOTEL / CAFE / RESTAURANT',desc:'Explore review and smart-menu touchpoints.'},{id:'visitor',title:'CURIOUS VISITOR',desc:'Take the complete founder-profile route.'}],state.visitor,'visitor')}if(key==='problemReveal'){const c=challenges[state.challenge];return `<div class="status-note">⏱ STATUS: LIVE // DRAW A CHALLENGE AND DECIDE HOW YOU WOULD SOLVE IT.</div><div class="shuffle-row"><button class="mini-btn" data-action="shuffle">↻ DRAW ANOTHER CHALLENGE</button></div><div class="challenge-card"><div class="challenge-top"><span class="cat">SMART BUSINESS IDENTITY</span><span class="diff">REAL-WORLD USE CASE</span></div><h3>${c.title}</h3><p>${c.desc}</p><div style="border-top:1px solid #e5e5e5;margin-top:14px;padding-top:10px"><div class="meta-copy" style="margin-bottom:6px">TRACK RULES / CONSTRAINTS:</div>${c.constraints.map(x=>`<div class="constraint"><b>✓</b><span>${x}</span></div>`).join('')}</div></div>`}if(key==='solutionDirection')return optionsHtml(solutions,state.solution,'solution');if(key==='techStack')return `<div class="tech-grid">${techs.map(t=>`<button class="tech ${state.tech.includes(t.id)?'selected':''}" data-action="tech" data-value="${t.id}"><b>${t.name}</b><span>${t.desc}</span></button>`).join('')}</div><div class="count">SELECT 3–4 COMPONENTS // ${state.tech.length} SELECTED</div>`;if(key==='usp')return optionsHtml(usps,state.usp,'usp');if(key==='features')return `<div class="tech-grid">${featurePool.map(t=>`<button class="tech ${state.features.includes(t.id)?'selected':''}" data-action="feature" data-value="${t.id}"><b>${t.name}</b><span>${t.desc}</span></button>`).join('')}</div><div class="count">PRIORITIZE EXACTLY 3 // ${state.features.length} SELECTED</div>`;if(key==='pitchDeck')return `<div class="status-note">DRAG-STYLE STORYBOARD // USE ↑ ↓ TO REORDER THE PROFILE STORY.</div><div class="rank-list">${state.story.map((s,i)=>`<div class="rank-card"><div class="rank-no">0${i+1}</div><div><b>${s}</b><p>${['Start with the real networking problem.','Show the tap / scan identity experience.','Explain the Vasuki NFC product direction.','Finish with direct contact and next action.'][['Problem','Smart Identity','Vasuki NFC Solution','Connect'].indexOf(s)]}</p></div><div class="rank-controls"><button data-action="moveup" data-value="${i}">↑</button><button data-action="movedown" data-value="${i}">↓</button></div></div>`).join('')}</div>`;if(key==='mentor')return `<div class="mentor-box"><div class="label">FOUNDER CHECKPOINT // VERIFIED PROFILE INFO</div><h3>Hemshankar Agarwal · Founder, Vasuki NFC</h3><p>Vasuki NFC is a Jaipur-based smart NFC business card and digital profile service brand. Its public website describes smart NFC business cards, QR digital visiting cards and Google Profile Cards, with tap/scan sharing for contact details, WhatsApp, website, Instagram and location.</p><div s file-photo"><img src="photos/profile.jpg" alt="Hemshankar Agarwal"></div><div class="result-copy"><div class="score-box"><div><div class="meta-copy">FINAL PROFILE RUN SCORE</div><div class="score-big">${score}</div></div><div class="grade">${grade}</div></div><h3>Hemshankar Agarwal</h3><div class="role">Founder · Vasuki NFC · Jaipur, Rajasthan</div><p>Founder profile unlocked. Vasuki NFC publicly describes itself as an independent smart NFC business card and digital profile service brand helping businesses share contact details, WhatsApp, website, Instagram and location with one tap or scan.</p><div class="contact-actions"><a class="dark" href="https://wa.me/916377393721" target="_blank" rel="noopener">WhatsApp</a><a href="tel:+916377393721">Call</a><a href="mailto:vasukinfc@gmail.com">Email</a><a href="https://vasukinfc.in/" target="_blank" rel="noopener">Website</a></div><div class="summary-table"><div class="summary-row"><b>Visitor</b><span>${labelValue(state.visitor)}</span></div><div class="summary-row"><b>Challenge</b><span>${challenges[state.challenge].title}</span></div><div class="summary-row"><b>Solution</b><span>${solutions.find(x=>x.id===state.solution)?.title||'—'}</span></div><div class="summary-row"><b>Reviewer</b><span>${state.judge||'—'}</span></div><div class="summary-row"><b>Contact</b><span>+91 6377393721 · vasukinfc@gmail.com</span></div></div></div></div><div style="display:flex;gap:8px;justify-content:center;margin-top:18px"><button class="secondary" data-action="replay">↻ REPLAY</button><a class="next" style="display:inline-flex;align-items:center;text-decoration:none" href="https://vasukinfc.in/" target="_blank" rel="noopener">OPEN VASUKI NFC →</a></div>`}return''}function labelValue(v){return({owner:'BUSINESS OWNER',professional:'WORKING PROFESSIONAL',hospitality:'HOTEL / CAFE / RESTAURANT',visitor:'CURIOUS VISITOR'})[v]||'—'}function calculateScore(){let s=58;if(state.solution===challenges[state.challenge].best)s+=8;if(state.tech.includes('nfc'))s+=4;if(state.tech.includes('qr'))s+=4;if(state.tech.includes('profile'))s+=5;if(state.usp==='all')s+=5;if(state.features.length===3)s+=4;if(state.story.join('|')==='Problem|Smart Identity|Vasuki NFC Solution|Connect')s+=4;if(state.mentorUsed)s+=3;if(state.product)s+=2;if(state.intent)s+=1;if(state.judge)s+=2;const mult=state.difficulty==='hard'?1.07:state.difficulty==='medium'?1.03:1;return Math.min(99,Math.round(s*mult))}function canNext(){const k=STAGES[state.stage].key;return k==='difficulty'?!!state.difficulty:k==='teamFormation'?!!state.visitor:k==='problemReveal'?true:k==='solutionDirection'?!!state.solution:k==='techStack'?state.tech.length>=3&&state.tech.length<=4:k==='usp'?!!state.usp:k==='features'?state.features.length===3:k==='pitchDeck'?true:k==='mentor'?true:k==='businessModel'?!!state.product:k==='pitchPrep'?!!state.intent:k==='judgeSpin'?!!state.judge:k==='judging'?state.evaluated:k==='results'?false:true}function subtitle(k){return({difficulty:'Decide how much time you want for this founder-profile run. Shorter pacing creates more pressure, just like the original simulator.',teamFormation:'Choose the visitor role you are bringing into the simulation. Your route will still unlock the same verified founder profile.',problemReveal:'Every smart business product starts with a real problem. Draw a challenge based on Vasuki NFC use cases.',solutionDirection:'Choose the product direction that best solves the challenge you drew.',techStack:'Select the building blocks that make a smart business identity work. Choose three or four.',usp:'Pick the strongest value proposition for the identity system you are building.',features:'Prioritize exactly three profile features. Your choices become part of the final result.',pitchDeck:'Arrange the founder story in the strongest sequence before the review stages.',mentor:'Pause the build and unlock the founder checkpoint based on Vasuki NFC public information.',businessModel:'Choose the Vasuki NFC product family that best matches what you want to explore.',pitchPrep:'Tell the simulator what you want after the final result screen.',judgeSpin:'Spin the reviewer wheel. The final evaluation will use this reviewer persona.',judging:'Run the staged evaluation. The terminal will validate your profile-game decisions one by one.',results:'Your run is complete. The founder profile, business identity and direct contact actions are now unlocked.'})[k]||''}function navHtml(){return `<div class="stage-nav"><div class="nav-left"><button class="secondary" data-action="back">&lt; BACK</button>${state.stage>0?'<button class="danger" data-action="giveup">GIVE UP</button>':''}</div><div class="stage-dots">${STAGES.map((_,i)=>`<span class="stage-dot ${i<state.stage?'done':''} ${i===state.stage?'current':''}"></span>`).join('')}</div><button class="next" data-action="next" ${canNext()?'':'disabled'}>NEXT ROUND &gt;</button></div>`}function renderGame(){state.screen='game';const st=STAGES[state.stage];app.innerHTML=`<div class="game">${renderHeader()}<div class="game-scroll"><div class="stage-wrap"><section class="stage-card"><div class="stage-meta"><div class="meta-left"><span class="meta-copy">${st.meta}</span><span class="meta-tag dark">MODE: FOUNDER</span></div><div class="meta-right">${state.difficulty?`<span class="meta-tag">PACE: ${state.difficulty}</span><span class="meta-tag dark">⏱ ${formatTime(state.time)}</span>`:''}</div></div><h2>${st.title}</h2><p class="stage-sub">${subtitle(st.key)}</p><div class="stage-content">${stageContent()}</div>${st.key==='results'?'':navHtml()}</section></div></div><footer class="game-footer"><span>Phase ${phaseIndex()+1} / ${PHASES.length}</span><span>HEMSHANKAR // VASUKI NFC</span></footer></div>`;if(st.key==='judging'&&state.evaluated)document.querySelectorAll('.term-line').forEach(x=>x.classList.add('done'))}function launch(){beep();state.stage=0;state.difficulty=null;state.screen='game';renderGame()}function chooseDifficulty(v){state.difficulty=v;startTimer({easy:600,medium:420,hard:300,dev:60}[v]);beep(340);renderGame()}function next(){if(!canNext()){showToast('COMPLETE THIS ROUND FIRST');return}if(state.stage<STAGES.length-1){beep(360);state.stage++;renderGame()}}function back(){if(state.stage===0){renderLanding();return}beep(260);state.stage--;renderGame()}function giveup(){if(confirm('Leave the founder simulator and lose this run?'))renderLanding()}function shuffle(){let ticks=0;const t=setInterval(()=>{state.challenge=Math.floor(Math.random()*challenges.length);renderGame();const b=document.querySelector('[data-action="shuffle"]');if(b)b.classList.add('spinning');beep(190+ticks*10,.02);if(++ticks>8){clearInterval(t);renderGame()}},90)}function toggleArray(arr,v,max){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else if(arr.length<max)arr.push(v);else showToast(`MAXIMUM ${max} SELECTIONS`)}function moveStory(i,dir){const j=i+dir;if(j<0||j>=state.story.length)return;[state.story[i],state.story[j]]=[state.story[j],state.story[i]];renderGame()}function spinJudge(){let spins=0;const wheel=document.getElementById('wheel'),t=setInterval(()=>{state.judge=judges[Math.floor(Math.random()*judges.length)];const b=wheel?.querySelector('b');if(b)b.textContent=state.judge;beep(210+spins*8,.02);if(++spins>12){clearInterval(t);if(wheel)wheel.style.transform='rotate(1080deg)';setTimeout(()=>renderGame(),350)}},90)}function evaluate(){if(state.judging)return;state.judging=true;state.evaluated=false;const btn=document.querySelector('[data-action="evaluate"]');if(btn){btn.disabled=true;btn.textContent='EVALUATING...'}let i=0;const lines=[...document.querySelectorAll('.term-line')],t=setInterval(()=>{if(i<lines.length){lines[i].classList.add('done');beep(420+i*40,.035);i++}else{clearInterval(t);state.judging=false;state.evaluated=true;showToast('PROFILE EVALUATION COMPLETE');setTimeout(()=>renderGame(),350)}},650)}app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,v=el.dataset.value;if(a==='launch')launch();else if(a==='difficulty')chooseDifficulty(v);else if(a==='visitor'){state.visitor=v;beep();renderGame()}else if(a==='next')next();else if(a==='back')back();else if(a==='giveup')giveup();else if(a==='shuffle')shuffle();else if(a==='solution'){state.solution=v;beep();renderGame()}else if(a==='tech'){toggleArray(state.tech,v,4);beep();renderGame()}else if(a==='usp'){state.usp=v;beep();renderGame()}else if(a==='feature'){toggleArray(state.features,v,3);beep();renderGame()}else if(a==='moveup')moveStory(+v,-1);else if(a==='movedown')moveStory(+v,1);else if(a==='mentor'){state.mentorUsed=true;beep(500);showToast('FOUNDER NOTE APPLIED');renderGame()}else if(a==='product'){state.product=v;beep();renderGame()}else if(a==='intent'){state.intent=v;beep();renderGame()}else if(a==='spin')spinJudge();else if(a==='evaluate')evaluate();else if(a==='replay'){clearInterval(state.timerId);Object.assign(state,{stage:0,difficulty:null,visitor:null,challenge:0,solution:null,tech:[],usp:null,features:[],story:['Problem','Smart Identity','Vasuki NFC Solution','Connect'],product:null,intent:null,judge:null,score:0,time:0,total:0,judging:false,evaluated:false,mentorUsed:false});renderLanding()}else if(a==='sound'){state.sound=!state.sound;renderGame()}});renderLanding()})();
